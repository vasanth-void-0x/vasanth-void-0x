<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Vasanth Kumar SOC Analyst cyber operations banner</title>
  <desc id="desc">A neon cyber security banner showing a hooded blue team operator and a live SOC monitoring dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070c"/>
      <stop offset="0.55" stop-color="#07131a"/>
      <stop offset="1" stop-color="#031016"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2930"/>
      <stop offset="1" stop-color="#061118"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2730"/>
      <stop offset="1" stop-color="#07141b"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#1ae4a2" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="microgrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#47f5c2" stroke-opacity="0.08" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hoodClip"><path d="M80 352C78 255 112 144 231 114C351 145 386 255 382 352L335 422H128Z"/></clipPath>
  </defs>

  <rect width="1400" height="520" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1397" height="517" rx="22.5" fill="none" stroke="#18dca1" stroke-opacity="0.42" stroke-width="3"/>
  <rect width="1400" height="520" rx="24" fill="url(#grid)"/>
  <path d="M0 82H1400M466 82V520" stroke="#2ef0b3" stroke-opacity="0.13"/>
  <path d="M25 24H150M1250 24H1375M25 496H150M1250 496H1375" stroke="#00f5a0" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Top status rail -->
  <circle cx="38" cy="51" r="6" fill="#ff4d6d"/>
  <circle cx="60" cy="51" r="6" fill="#ffc857"/>
  <circle cx="82" cy="51" r="6" fill="#00f5a0" filter="url(#glow)"/>
  <text x="108" y="58" fill="#7797a2" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">AEGIS://SOC_PROFILE</text>
  <text x="1127" y="58" fill="#00f5a0" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">● SYSTEM ONLINE</text>

  <!-- Operator glow -->
  <ellipse cx="230" cy="299" rx="170" ry="180" fill="#00efab" opacity="0.055" filter="url(#softGlow)"/>
  <g clip-path="url(#hoodClip)">
    <rect x="64" y="108" width="340" height="316" fill="url(#microgrid)"/>
    <path d="M80 352C78 255 112 144 231 114C351 145 386 255 382 352L335 422H128Z" fill="url(#hood)" stroke="#00e5a3" stroke-width="3"/>
    <path d="M139 298C142 210 176 166 231 150C287 166 323 212 325 298C286 329 178 330 139 298Z" fill="#02060a" stroke="#23cda0" stroke-opacity="0.68" stroke-width="2"/>
    <path d="M168 289C183 301 204 307 231 307C258 307 280 301 295 289" fill="none" stroke="#00f5a0" stroke-width="3" opacity="0.72"/>
    <path d="M181 257L213 253M249 253L281 257" stroke="#46ffd1" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M102 331C145 311 176 306 231 306C286 306 322 312 362 331L338 429H124Z" fill="#071b22" stroke="#149b79" stroke-width="2"/>
  </g>
  <path d="M80 352C78 255 112 144 231 114C351 145 386 255 382 352" fill="none" stroke="#00f5a0" stroke-width="3" opacity="0.75" filter="url(#glow)"/>

  <!-- Laptop -->
  <path d="M92 333H370L346 445H116Z" fill="url(#screen)" stroke="#00f5a0" stroke-width="3"/>
  <path d="M72 445H390L369 468H93Z" fill="#0d2930" stroke="#00bb88" stroke-width="2"/>
  <path d="M231 364L260 377V400C260 417 248 427 231 434C214 427 202 417 202 400V377Z" fill="none" stroke="#00f5a0" stroke-width="3" filter="url(#glow)"/>
  <path d="M218 398L228 408L246 388" fill="none" stroke="#00f5a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="493" fill="#5f7c87" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="3">BLUE TEAM OPERATOR // V</text>

  <!-- Identity -->
  <text x="510" y="133" fill="#f0fff9" font-size="54" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="2">VASANTH KUMAR</text>
  <rect x="512" y="154" width="79" height="5" rx="2.5" fill="#00f5a0" filter="url(#glow)"/>
  <text x="608" y="166" fill="#74f7cf" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="3">SOC ANALYST // SECURITY AUTOMATION</text>

  <!-- Dashboard frame -->
  <rect x="510" y="202" width="846" height="260" rx="14" fill="#061117" stroke="#1e5660" stroke-width="2"/>
  <path d="M510 240H1356" stroke="#1a5159"/>
  <circle cx="535" cy="221" r="5" fill="#00f5a0"/>
  <text x="552" y="227" fill="#8bb7bb" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LIVE SECURITY OPERATIONS CONSOLE</text>
  <text x="1225" y="227" fill="#00f5a0" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MONITORING</text>

  <!-- KPI cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="530" y="258" width="154" height="70" rx="8" fill="#0a1c23" stroke="#174954"/>
    <text x="545" y="282" fill="#6f929b" font-size="13">EVENTS / 24H</text>
    <text x="545" y="316" fill="#e9fff8" font-size="27" font-weight="700">12,482</text>
    <path d="M646 306L657 295L669 300" fill="none" stroke="#00f5a0" stroke-width="3"/>

    <rect x="700" y="258" width="154" height="70" rx="8" fill="#0a1c23" stroke="#174954"/>
    <text x="715" y="282" fill="#6f929b" font-size="13">OPEN ALERTS</text>
    <text x="715" y="316" fill="#ff5575" font-size="27" font-weight="700">07</text>
    <circle cx="831" cy="302" r="8" fill="#ff3b6b" opacity="0.22"/>
    <circle cx="831" cy="302" r="4" fill="#ff3b6b" filter="url(#glow)"/>

    <rect x="870" y="258" width="154" height="70" rx="8" fill="#0a1c23" stroke="#174954"/>
    <text x="885" y="282" fill="#6f929b" font-size="13">MTTR</text>
    <text x="885" y="316" fill="#00f5a0" font-size="27" font-weight="700">08m</text>
    <text x="981" y="313" fill="#56b99a" font-size="12">▼ 18%</text>
  </g>

  <!-- Alert feed -->
  <rect x="1040" y="258" width="296" height="184" rx="8" fill="#081a20" stroke="#174954"/>
  <text x="1057" y="282" fill="#90b7bd" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ALERT QUEUE</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <rect x="1057" y="298" width="262" height="34" rx="5" fill="#2b101a"/>
    <rect x="1068" y="307" width="37" height="16" rx="3" fill="#ff3b6b"/>
    <text x="1075" y="319" fill="#fff" font-size="10">HIGH</text>
    <text x="1117" y="320" fill="#efb2bf">Credential attack</text>
    <text x="1275" y="320" fill="#ff7790">NEW</text>

    <rect x="1057" y="340" width="262" height="34" rx="5" fill="#241e0d"/>
    <rect x="1068" y="349" width="37" height="16" rx="3" fill="#ffc857"/>
    <text x="1071" y="361" fill="#1b1300" font-size="9">MED</text>
    <text x="1117" y="362" fill="#e8d5a1">Suspicious PowerShell</text>
    <text x="1278" y="362" fill="#e6bd53">04m</text>

    <rect x="1057" y="382" width="262" height="34" rx="5" fill="#09221c"/>
    <rect x="1068" y="391" width="37" height="16" rx="3" fill="#00d89a"/>
    <text x="1074" y="403" fill="#032016" font-size="9">LOW</text>
    <text x="1117" y="404" fill="#93d7c1">Geo anomaly reviewed</text>
    <text x="1270" y="404" fill="#49cda5">DONE</text>
  </g>

  <!-- Telemetry chart -->
  <rect x="530" y="344" width="494" height="98" rx="8" fill="#081a20" stroke="#174954"/>
  <text x="545" y="367" fill="#779ca4" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">THREAT TELEMETRY</text>
  <path d="M547 422H1005M547 397H1005M547 376H1005" stroke="#1a3a42" stroke-width="1"/>
  <path d="M550 421L580 410L612 416L644 385L676 404L709 394L742 411L775 375L807 395L840 388L872 403L905 364L938 383L971 372L1005 380" fill="none" stroke="#00f5a0" stroke-width="3" filter="url(#glow)"/>
  <path d="M550 421L580 410L612 416L644 385L676 404L709 394L742 411L775 375L807 395L840 388L872 403L905 364L938 383L971 372L1005 380V430H550Z" fill="#00f5a0" opacity="0.08"/>

  <text x="519" y="490" fill="#00f5a0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">DETECT</text>
  <text x="598" y="490" fill="#355a61" font-size="15">→</text>
  <text x="630" y="490" fill="#9bdccc" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">INVESTIGATE</text>
  <text x="760" y="490" fill="#355a61" font-size="15">→</text>
  <text x="791" y="490" fill="#9bdccc" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">AUTOMATE</text>
  <text x="896" y="490" fill="#355a61" font-size="15">→</text>
  <text x="927" y="490" fill="#00f5a0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">RESPOND WITH EVIDENCE</text>
</svg>
